<style>
/* Layout concept: soft rounded bands on a cool neutral ground. A deep teal-blue anchors trust, sunshine yellow and coral
   carry the joy. One bold moment: the block-and-rainbow hero. Everything else stays calm, spacious and readable. */
:root{
  --bg:#F6F8FD;--surface:#FFFFFF;--surface-2:#E8EFFB;--ink:#14213D;--ink-2:#4B5878;--line:#D6DEEE;
  --primary:#1D4F9F;--primary-d:#153C7C;--on-primary:#FFFFFF;
  --teal:#2F6FD1;--green:#0B8A3E;--purple:#3A3187;--purple-t:#E4E1F7;--sun:#FBB800;--on-sun:#3A2A00;--coral:#D62F2F;--coral-ink:#B3201F;--mint:#0B9444;--primary-c:#1D4F9F;
  --sun-t:#FFF0BF;--coral-t:#FBDDDC;--mint-t:#D6F0DF;--teal-t:#DCE8FA;
  --b-blue:#1D4F9F;--b-green:#087F3B;--b-yellow:#FBB800;--b-red:#D62F2F;--b-purple:#3A3187;
  --band:#173F85;--band-g:#07703A;--band-p:#3A3187;--on-band:#F4F8FF;--on-band-2:#C3D3F0;--band-line:rgba(255,255,255,.2);
  --shadow:0 1px 2px rgba(14,42,53,.06),0 10px 28px rgba(14,42,53,.07);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;--f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:24px;--nav-h:72px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1526;--surface:#15203A;--surface-2:#1B2A4D;--ink:#EEF3FC;--ink-2:#B1BFDA;--line:#2C3D66;
  --primary:#7DAEF5;--primary-d:#A9C8FA;--on-primary:#0A1B3D;--primary-c:#7DAEF5;
  --teal:#6FA8F5;--green:#4CCB7F;--purple:#A79FF2;--purple-t:#2A2656;--coral:#FF6B5E;--coral-ink:#FF9B91;--mint:#3DC773;
  --sun-t:#3D3208;--coral-t:#46211F;--mint-t:#12381F;--teal-t:#16305A;
  --b-blue:#2F6AD0;--b-green:#0C7F3C;--b-yellow:#FBB800;--b-red:#CC2F34;--b-purple:#5B50C8;
  --band:#17346F;--band-g:#0C4B2A;--band-p:#2B2570;--on-band:#F0F5FD;--on-band-2:#B9C9E6;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1526;--surface:#15203A;--surface-2:#1B2A4D;--ink:#EEF3FC;--ink-2:#B1BFDA;--line:#2C3D66;
  --primary:#7DAEF5;--primary-d:#A9C8FA;--on-primary:#0A1B3D;--primary-c:#7DAEF5;
  --teal:#6FA8F5;--green:#4CCB7F;--purple:#A79FF2;--purple-t:#2A2656;--coral:#FF6B5E;--coral-ink:#FF9B91;--mint:#3DC773;
  --sun-t:#3D3208;--coral-t:#46211F;--mint-t:#12381F;--teal-t:#16305A;
  --b-blue:#2F6AD0;--b-green:#0C7F3C;--b-yellow:#FBB800;--b-red:#CC2F34;--b-purple:#5B50C8;
  --band:#17346F;--band-g:#0C4B2A;--band-p:#2B2570;--on-band:#F0F5FD;--on-band-2:#B9C9E6;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;letter-spacing:-.015em;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(2.3rem,1.2rem + 5vw,4.3rem);font-weight:800}
h2{font-size:clamp(1.8rem,1.1rem + 2.6vw,2.8rem)}
h3{font-size:1.28rem;line-height:1.2}
h4{font-size:1.05rem}
p{margin:0}
a{color:var(--primary);text-underline-offset:3px}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:999px;border:0;font:700 1rem var(--f-body)}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.ic{width:1.4em;height:1.4em;flex:none}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(52px,7vw,96px)}
.band.alt{background:var(--surface-2)}
.band.tight{padding-block:clamp(36px,5vw,64px)}
.band.deep{background-color:var(--band);color:var(--on-band);background-image:radial-gradient(circle at 10% 18%,rgba(251,184,0,.45) 0 7px,transparent 8px),radial-gradient(circle at 92% 24%,rgba(255,255,255,.16) 0 16px,transparent 17px),radial-gradient(circle at 78% 90%,rgba(214,47,47,.5) 0 8px,transparent 9px),radial-gradient(circle at 4% 88%,rgba(11,148,68,.55) 0 12px,transparent 13px)}
.band.deep.g{background-color:var(--band-g)}.band.deep.p{background-color:var(--band-p)}
.band.deep .lead,.band.deep p{color:var(--on-band-2)}
.band.deep h2,.band.deep h3{color:var(--on-band)}
.eyebrow{font:700 1.6rem/1 var(--f-hand);color:var(--coral-ink);margin-bottom:10px;display:inline-block;transform:rotate(-1.5deg);transform-origin:left center}
.band.deep .eyebrow{color:var(--sun)}
.lead{font-size:1.18rem;color:var(--ink-2);max-width:62ch;margin-top:14px}
.sec-head{margin-bottom:clamp(28px,4vw,48px);max-width:760px}
.sec-head.center{margin-inline:auto;text-align:center}.sec-head.center .lead{margin-inline:auto}
.muted{color:var(--ink-2)}
.note{font-size:.9rem;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--b-blue) 0 25%,var(--b-green) 25% 50%,var(--b-yellow) 50% 75%,var(--b-red) 75%)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:var(--nav-h)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.2rem/1 var(--f-display);margin-right:auto;min-width:0}
.brand small{display:block;font:600 .68rem/1.2 var(--f-body);color:var(--ink-2);letter-spacing:.04em;margin-top:3px}
.brand img{height:50px;width:auto;display:block}
.logoplate{display:inline-block;background:#fff;border-radius:18px;padding:8px 14px}.logoplate img{height:58px;width:auto;display:block}
.menu-btn{min-height:48px;min-width:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.menu-btn .ic{width:26px;height:26px}
#nav{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));max-height:calc(100dvh - var(--nav-h) - env(safe-area-inset-top,0px));overflow:auto;box-shadow:var(--shadow)}
#nav.open{display:block}
#nav a{display:block;padding:14px 12px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700}
#nav a[aria-current="page"]{background:var(--teal-t);color:var(--primary)}
.top .enq{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 26px;border-radius:999px;border:2px solid transparent;font:700 1.02rem/1.2 var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;text-align:center}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-d)}
.btn-sun{background:var(--sun);color:var(--on-sun)}
.btn-sun:hover{background:#FFD566}
.btn-ghost{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn-ghost:hover{background:var(--teal-t)}
.band.deep .btn-ghost{color:var(--on-band);border-color:var(--on-band-2)}
.band.deep .btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn.lg{min-height:58px;padding-inline:30px;font-size:1.08rem}
.btn.sm{min-height:44px;padding:8px 18px;font-size:.95rem}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}

/* hero */
.hero{padding-block:clamp(36px,6vw,80px) clamp(44px,6vw,84px);background:radial-gradient(circle at 6% 12%,var(--sun-t) 0 90px,transparent 91px),radial-gradient(circle at 97% 88%,var(--mint-t) 0 130px,transparent 131px),radial-gradient(circle at 62% 2%,var(--teal-t) 0 80px,transparent 81px),radial-gradient(circle at 2% 96%,var(--coral-t) 0 70px,transparent 71px),var(--bg)}
.hl1{color:var(--teal)}.hl2{color:var(--green)}.hl3{color:var(--coral-ink)}.hl4{color:var(--purple)}
.hero-grid{display:grid;gap:clamp(24px,4vw,56px);align-items:center}
.hero-copy .lead{margin-block:18px 28px;font-size:1.22rem}
.fr-link{display:inline-flex;gap:8px;align-items:center;margin-top:22px;font-weight:700;color:var(--coral-ink);text-decoration:none;padding:6px 0;min-height:44px}
.fr-link:hover{text-decoration:underline}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0;padding:0;list-style:none}
.pill-row li{padding:7px 16px;border-radius:999px;border:0;font-weight:700;font-size:.9rem;background:var(--teal-t)}.pill-row li:nth-child(2){background:var(--mint-t)}.pill-row li:nth-child(3){background:var(--sun-t)}.pill-row li:nth-child(4){background:var(--coral-t)}
.hero-art svg{width:100%;height:auto;display:block}

/* grids */
.grid{display:grid;gap:18px}
.g2,.g3,.g4{grid-template-columns:1fr}
@media(min-width:620px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:760px){.g2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:940px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;min-width:0}
.card.soft{background:var(--surface-2);border-color:transparent}
.feat .ibox{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin-bottom:16px;background:var(--b-blue);color:#fff}
.feat:nth-child(4n+2) .ibox{background:var(--b-green)}.feat:nth-child(4n+3) .ibox{background:var(--b-yellow);color:#2B2000}.feat:nth-child(4n) .ibox{background:var(--b-red)}
.feat:hover{border-color:var(--primary)}
.feat h3{margin-bottom:8px}
.feat p{color:var(--ink-2);font-size:1rem}
.tone-sun{background:var(--sun-t)}.tone-coral{background:var(--coral-t)}.tone-mint{background:var(--mint-t)}.tone-teal{background:var(--teal-t)}.tone-purple{background:var(--purple-t)}
.c-sun{background:var(--b-yellow);color:#2B2000}.c-coral{background:var(--b-red);color:#fff}.c-mint{background:var(--b-green);color:#fff}.c-teal{background:var(--b-blue);color:#fff}.c-purple{background:var(--b-purple);color:#fff}

/* programmes */
.pg{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:620px){.pg{grid-template-columns:repeat(2,1fr)}.pg>:last-child{grid-column:span 2}}
@media(min-width:940px){.pg{grid-template-columns:repeat(6,1fr)}.pg>*{grid-column:span 2}.pg>:nth-child(n+4){grid-column:span 3}}
.pcard{border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;right:-36px;top:-36px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18)}
.pcard>*{position:relative;z-index:1}
.grp{font:800 1.55rem/1.1 var(--f-display);margin:0 0 18px}
.pcard .tag{background:rgba(255,255,255,.26);color:inherit;border:0;align-self:flex-start}
.pcard .age{font:800 clamp(1.7rem,1.2rem + 1.6vw,2.4rem)/1 var(--f-display);letter-spacing:-.02em}
.pcard .age small{font:700 .9rem var(--f-body);opacity:.8;margin-left:4px}
.pcard p{color:inherit;opacity:.94}
.pcard .link{margin-top:auto;padding-top:8px;color:inherit}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font:700 .78rem/1.4 var(--f-body);background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.tag.sample{background:var(--sun-t);color:var(--ink);border-color:transparent}
.tag.own{background:var(--teal-t);color:var(--primary);border-color:transparent}
.tag.fr{background:var(--coral-t);color:var(--coral-ink);border-color:transparent}

/* seeds */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 .98rem var(--f-body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seedpanel{border-radius:var(--r);padding:clamp(24px,4vw,44px);display:grid;gap:26px}
@media(min-width:860px){.seedpanel{grid-template-columns:1.1fr 1fr;align-items:start}}
.seedpanel .big{font:800 clamp(1.7rem,1rem + 2.2vw,2.5rem)/1.05 var(--f-display);margin:8px 0 12px}
.seedpanel .ibox{width:60px;height:60px;border-radius:20px;background:var(--surface);display:grid;place-items:center;color:var(--primary)}
.seedpanel .ibox .ic{width:32px;height:32px}
.seedpanel .sub{background:var(--surface);border-radius:18px;padding:18px 20px}
.seedpanel .sub+.sub{margin-top:12px}
.seedpanel .sub h4{margin-bottom:6px;color:var(--primary)}
.seedpanel .sub p{font-size:1rem;color:var(--ink-2)}
.cycle{display:grid;gap:14px;margin-top:6px}
@media(min-width:760px){.cycle{grid-template-columns:repeat(3,1fr)}}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:620px){.tl{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.tl{grid-template-columns:repeat(4,1fr)}}
.tl li{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;position:relative;min-width:0}
.tl time{display:inline-block;font:700 .85rem var(--f-mono);padding:4px 10px;border-radius:999px;background:var(--sun-t);color:var(--ink);margin-bottom:12px;font-variant-numeric:tabular-nums}
.tl li:nth-child(4n+2) time{background:var(--mint-t)}.tl li:nth-child(4n+3) time{background:var(--teal-t)}.tl li:nth-child(4n) time{background:var(--coral-t)}
.tl h4{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.tl h4 .ic{color:var(--primary)}
.tl p{font-size:.97rem;color:var(--ink-2)}

/* page head */
.phead{position:relative;overflow:hidden;background:var(--teal-t);padding-block:clamp(36px,5vw,72px)}
.phead.t-purple{background:var(--purple-t)}.phead.t-sun{background:var(--sun-t)}.phead.t-coral{background:var(--coral-t)}.phead.t-mint{background:var(--mint-t)}.phead.t-teal{background:var(--teal-t)}
.phead::after{content:"";position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;background:var(--surface);opacity:.55}
.phead::before{content:"";position:absolute;right:120px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:var(--surface);opacity:.35}
.phead .wrap{position:relative;z-index:1}
.phead .pencil{position:absolute;right:max(16px,3%);bottom:18px;width:min(300px,30vw);z-index:0;display:none}
@media(min-width:860px){.phead .pencil{display:block}}
.phead .lead{color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:.9rem;margin-bottom:18px;color:var(--ink-2)}
.crumbs a{color:var(--ink-2)}
.crumbs .sep{opacity:.5}

/* lists */
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks .ic{color:var(--green);margin-top:2px;width:1.3em;height:1.3em}
.split{display:grid;gap:28px}
@media(min-width:900px){.split{grid-template-columns:1.5fr 1fr;align-items:start}.split.even{grid-template-columns:1fr 1fr}}
.facts dl{margin:0;display:grid;gap:14px}
.facts dt{font:700 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.facts dd{margin:2px 0 0;font-weight:700}
.routine{list-style:none;margin:0;padding:0}
.routine li{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.routine li:last-child{border-bottom:0}
.routine b{font:700 .95rem var(--f-mono);color:var(--primary);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 .95rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.static{cursor:default;background:var(--surface-2);border-color:transparent}

/* faq */
details.faq{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 22px}
details.faq+details.faq{margin-top:12px}
details.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0;font:700 1.06rem/1.35 var(--f-body);min-height:56px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .ic{transition:transform .2s;flex:none;color:var(--primary)}
details.faq[open] summary .ic{transform:rotate(45deg)}
details.faq .ans{padding:0 0 20px;color:var(--ink-2);max-width:70ch}

/* safety */
.safe{display:flex;gap:16px;align-items:flex-start}
.safe .ibox{width:48px;height:48px;border-radius:14px;background:var(--mint-t);color:var(--primary);display:grid;place-items:center;flex:none}
.safe h4{margin-bottom:4px}
.safe p{font-size:.97rem;color:var(--ink-2)}

/* finder */
.finder{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(18px,3vw,32px)}
.fbox{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;background:var(--bg)}
.fbox:focus-within{border-color:var(--primary)}
.fbox .ic{color:var(--ink-2)}
.fbox input{flex:1;min-width:0;border:0;background:transparent;font:600 1.05rem var(--f-body);color:var(--ink);min-height:44px;outline:none}
.fbox .btn{min-height:46px;padding-inline:22px}
.finder .chips{margin-top:16px}

function trustStrip(){
 return `<section class="trust-band"><div class="wrap"><div class="trust">${[["cap","Playgroup to Class 5","Taught through the Myjo Curriculum"],["heart","Tarbiya","Character and manners in every programme"],["shield","Safe, child-friendly campuses","Secure entry and caring staff"],["people","Owned and franchise centres","One shared standard of care"]].map(t=>`<div><span class="blob">${ic(t[0])}</span><p><b>${t[1]}</b>${t[2]}</p></div>`).join("")}</div></div></section>`;

function campusBand(){
 const cap=["Activity room","Learning room","Reading and activity room"];
 return band("",`<div class="row" style="justify-content:space-between;align-items:end;margin-bottom:28px">${head("step inside","Bright, child-sized <span class='mark'>classrooms</span>","Furniture at the right height, display boards for children's own work and a reading shelf within reach. Our centres follow a common classroom layout.")}<a class="link" href="#centres">Find a centre ${ic("arrow")}</a></div><div class="mosaic">${[0,1,2].map(i=>`<figure>${phImg(i===0?"L0":"T"+i,ALTS[i])}<figcaption>${cap[i]}</figcaption></figure>`).join("")}</div>`);
}
function admissionsBand(){
 const st=[["Enquire","Fill in the short form or message us on WhatsApp."],["Visit","Tour the centre, see a class and ask anything."],["Meet the team","Talk through programme, timings and fees."],["Join","Complete registration and receive your settling-in plan."]];
 return band("",`${head("how admissions work","Four steps from hello to the first day")}<ol class="steps cols">${st.map(x=>`<li><div><h4>${x[0]}</h4><p>${x[1]}</p></div></li>`).join("")}</ol><div class="cta-row" style="margin-top:26px">${enqBtn("Book a School Visit","visit",{},"btn-primary lg")}<a class="btn btn-ghost lg" href="#parent-corner">Parent corner</a></div>`)+
 band("alt",`<div class="split even why-wrap"><div><p class="eyebrow">parents often ask</p><h2>Questions before you visit</h2><p class="lead">Cannot find your answer? Our admissions team is happy to help.</p><div class="cta-row" style="margin-top:22px">${enqBtn("Ask a question","general",{topic:"Admissions"},"btn-primary")}<a class="btn btn-ghost" href="#contact">Contact us</a></div></div><div>${faq([["From what age can my child join?","Playgroup starts at about 1.5 years. Each centre confirms its age cut-off."],["Which classes do you offer?","Playgroup, Nursery, PP1, PP2 and Day Care, and Classes 1 to 5 at centres with a primary wing."],["What is the Myjo Curriculum?","Myjo is our own curriculum from Nursery to Class 5. It teaches through activities and projects, and tracks progress against clear outcomes."],["What is Tarbiya?","Tarbiya is the nurturing of character and manners with love. It is part of every programme."],["Can I visit before deciding?","Yes. Book a visit online and the team will show you around."]])}</div></div>`);
}
